<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Todo List</h1>
    </header>

    <main>
        <section class="todo-panel">

            <div class="panel-header">
                <h2>To Do</h2>
                <span id="task-count">0 Tasks</span>
            </div>

            <div class="todo-list" aria-live="polite">
            </div>

        </section>

        <aside class="detail-panel">

            <form class="new-todo">
                <h3>Create New Todo</h3>

                <label for="title">Title</label>
                <input
                    type="text"
                    id="title"
                    placeholder="Enter todo title"
                    required
                >

                <label for="description">Description</label>
                <textarea
                    id="description"
                    placeholder="Enter description"
                    required
                ></textarea>

                <label for="date">Date</label>
                <input type="date" id="date">

                <label for="notification">Notification Time</label>
                <input type="datetime-local" id="notification">

                <label for="image">Todo Image</label>
                <input
                    type="file"
                    id="image"
                    accept="image/*"
                    capture="environment"
                >

                <button type="button" id="camera-button">
                    Open Camera
                </button>

                <video id="camera" autoplay hidden></video>

                <button type="button" id="capture-button" hidden>
                    Capture Image
                </button>

                <canvas id="canvas" hidden></canvas>

                <button type="submit">
                    Create Todo
                </button>
            </form>

            <button type="button" id="theme-button">
                Light / Dark Mode
            </button>

        </aside>
    </main>

    <footer>
        <p>Dhia Hiroyuki Prawira</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
