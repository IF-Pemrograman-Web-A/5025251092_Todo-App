<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Todo List</h1>
    </header>

    <main>
        <section class="todo-panel">

            <div class="panel-header">
                <h2>To Do</h2>
                <span>Tasks</span>
            </div>

            <div class="todo-list"></div>

        </section>

        <aside class="detail-panel">

            <form class="new-todo">
                <h3>Create New Todo</h3>

                <label for="title">Title</label>
                <input type="text" id="title" required>

                <label for="description">Description</label>
                <textarea id="description" required></textarea>

                <label for="date">Date</label>
                <input type="date" id="date">

                <label for="image">Image</label>
                <input type="file" id="image" accept="image/*" capture="environment">

                <label for="notification">Notification Time</label>
                <input type="datetime-local" id="notification">

                <button type="submit">Create Todo</button>
            </form>

            <button id="theme-button">Light / Dark Mode</button>

        </aside>
    </main>

    <footer>
        <p>Dhia Hiroyuki Prawira</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
